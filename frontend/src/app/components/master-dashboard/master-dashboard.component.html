<ng-container *ngIf="scope() === 'MASTER'">
  <app-master-dashboard-dashboard
    *ngIf="currentSegment() === 'DASHBOARD'"
    [t]="t()"
    [metrics]="metrics"
    [tenants]="tenants()"
    [searchTerm]="searchTerm()"
    [tenantForm]="tenantForm()"
    (tenantFormChange)="tenantFormChange.emit($event)"
    [activePricingMatrix]="activePricingMatrix()"
    (onFuzzySearch)="onFuzzySearch.emit($event)"
    (onSelectTenant)="onSelectTenant.emit($event)"
    (onCreateTenant)="onCreateTenant.emit($event)"
    (onNextPage)="onNextPage.emit()"
    (onPrevPage)="onPrevPage.emit()"
  ></app-master-dashboard-dashboard>

  <app-master-dashboard-partners
    *ngIf="currentSegment() === 'PARTNERS'"
    [t]="t()"
    [tenants]="tenants()"
    [tenantForm]="tenantForm()"
    (tenantFormChange)="tenantFormChange.emit($event)"
    [activePricingMatrix]="activePricingMatrix()"
    (activePricingMatrixChange)="activePricingMatrixChange.emit($event)"
    (onSelectTenant)="onSelectTenant.emit($event)"
    (onCreateTenant)="onCreateTenant.emit($event)"
    (onNextPage)="onNextPage.emit()"
    (onPrevPage)="onPrevPage.emit()"
    (onFuzzySearch)="onFuzzySearch.emit($event)"
  ></app-master-dashboard-partners>
</ng-container>
